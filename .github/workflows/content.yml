name: Verify Content

on:
  pull_request:
  push:
    paths:
    - '.github/workflows/content.yml'
    - '**'
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Content
      uses: actions/checkout@v6
      with:
        path: content

    - name: Clone Engine
      uses: actions/checkout@v6
      with:
        repository: Matt-Gould29/Engine-TS # @plugin-hook
        ref: '289-plugin' # @plugin-hook
        path: engine

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: engine/package-lock.json

    - name: Install dependencies
      working-directory: engine
      run: npm ci

    # Plugins add configs, so the packer's CRC gate - which compares against checksums of the
    # authentic 289 data - no longer matches by design. Verifying that the content still *packs*
    # is the part that stays useful.
    - name: Configure the build # @plugin-hook
      working-directory: engine
      run: |
        mkdir -p data/config
        printf '{\n  "build": { "verify": false, "srcDir": "../content" }\n}\n' > data/config/world.json

    - name: Pack
      working-directory: engine
      run: npm run build
